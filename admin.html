<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Store administration — King Stripe</title>
  <link rel="stylesheet" href="assets/css/king-stripe-collections.css">
  <link rel="stylesheet" href="assets/css/king-stripe-admin.css">
  <script src="assets/js/king-stripe-admin.js" defer></script>
</head>
<body class="admin-page">
  <main class="admin-shell">
    <a class="admin-brand" href="index.html">KING STRIPE <span>/ STORE ADMIN</span></a>
    <section id="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Private operator access</p>
      <h1 id="login-title">SIGN IN</h1>
      <form id="admin-login">
        <label>Username<input name="username" autocomplete="username" required maxlength="120"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <button class="checkout-button" type="submit">Sign in</button>
      </form>
    </section>
    <section id="admin-panel" hidden aria-label="Store administration">
      <div class="admin-top"><div><p class="eyebrow">King Stripe / Operations</p><h1>ORDERS & STOCK</h1></div><button id="logout" type="button">Sign out</button></div>
      <p id="admin-message" role="status" aria-live="polite"></p>
      <div class="admin-tabs"><button type="button" data-tab="orders" aria-pressed="true">Orders</button><button type="button" data-tab="variants" aria-pressed="false">Variants & inventory</button><button type="button" data-tab="audit" aria-pressed="false">Audit log</button></div>
      <section id="orders-panel"><div class="admin-tools"><label>Search reference/email<input id="order-search" type="search" maxlength="100"></label><label>Payment state<select id="order-status"><option value="">All</option><option value="pending_payment">Pending payment</option><option value="paid">Paid</option><option value="payment_failed">Payment failed</option><option value="cancelled">Cancelled</option><option value="partially_refunded">Partially refunded</option><option value="refunded">Refunded</option></select></label><button id="refresh-orders" type="button">Refresh orders</button></div><div id="orders-list" class="admin-list"></div><article id="order-detail" hidden></article></section>
      <section id="variants-panel" hidden><div id="variants-list" class="admin-list"></div></section>
      <section id="audit-panel" hidden><div id="audit-list" class="admin-list"></div></section>
    </section>
  </main>
</body>
</html>
